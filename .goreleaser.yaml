# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: alita_robot

release:
  replace_existing_draft: true
  header: |
    Welcome to this new release!

  footer: |
    Docker 🐳 images are published from `main` by CI, not by this release:
    `docker pull ghcr.io/fullstacksjs/alita-bot:{{ .ShortCommit }}`

gomod:
  env:
    - CGO_ENABLED=1

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - binary: alita_robot
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/divkix/Alita_Robot/alita/config.Commit={{ .ShortCommit }}

archives:
  # - rlcp: true
  - name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- with .Arm }}v{{ . }}{{ end }}
      {{- with .Mips }}_{{ . }}{{ end }}
      {{- if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  use: github
  sort: asc
  abbrev: -1
  groups:
    - title: "🚀 Features"
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: "⚡ Performance"
      regexp: '^perf(\(.+\))?!?:'
      order: 2
    - title: "🔒 Security"
      regexp: '^sec(urity)?(\(.+\))?!?:'
      order: 3
    - title: "♻️ Refactoring"
      regexp: '^refactor(\(.+\))?!?:'
      order: 4
    - title: "📦 Other"
      order: 999
  filters:
    exclude:
      - '^test(\(.+\))?:'
      - '^chore(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^deps(\(.+\))?:'
      - Merge pull request
      - Merge branch

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Container images are not built here. `docker/alpine` is the single supported
# image definition and CI publishes it from main.

name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Verify code formatting and linting
  lint:
    name: Code Quality & Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check code formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted with gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Run linting
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.6
          install-mode: binary
          args: --timeout 10m

  # Binary compilation verification
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Extract short commit SHA
        id: short-sha
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Build Go binary
        run: |
          set -euo pipefail
          short_sha="${{ steps.short-sha.outputs.short_sha }}"
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X github.com/divkix/Alita_Robot/alita/config.Commit=${short_sha}" -o /tmp/alita_robot .
          if [ "$(cd /tmp && ./alita_robot --version)" != "$short_sha" ]; then
            echo "::error::--version did not report the injected commit ${short_sha}"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ github.sha }}
          path: /tmp/alita_robot
          retention-days: 7

  # Automated unit and integration tests (including race detector)
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT_TOKEN: test-token
      OWNER_ID: "1"
      SQLITE_PATH: "/tmp/alita-ci.db"
      USE_WEBHOOKS: "false"
      LOG_LEVEL: "info"
      CGO_ENABLED: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Ensure C toolchain for CGO
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential libsqlite3-dev

      - name: Run test suite
        run: make test

      - name: Report coverage
        if: always()
        run: |
          if [ -f coverage.out ]; then
            COVERAGE=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}')
            echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Total Coverage:** ${COVERAGE}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage.out
          retention-days: 30
          if-no-files-found: ignore

  # Translation completeness gate
  translations-check:
    name: Translations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check translations
        run: make check-translations

  # Production image build plus a runtime check of the supported deployment
  docker-verify:
    name: Docker Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract short commit SHA
        id: short-sha
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Build production image (linux/amd64)
        run: |
          set -euo pipefail
          docker build --build-arg COMMIT=${{ steps.short-sha.outputs.short_sha }} -f docker/alpine -t test-build:latest .

      - name: Verify container health and SQLite persistence
        run: scripts/docker-acceptance/run.sh test-build:latest

  # Publish Docker images for main branch pushes and tag releases
  docker-publish:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, build, test, translations-check, docker-verify]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short commit SHA
        id: short-sha
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.short-sha.outputs.short_sha }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=Alita Robot
            org.opencontainers.image.description=Production image for Alita Robot
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/alpine
          platforms: linux/amd64
          build-args: |
            COMMIT=${{ steps.short-sha.outputs.short_sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=main
          cache-to: type=gha,mode=max,scope=main,ignore-error=true

  # CI success gate
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, build, test, translations-check, docker-verify, docker-publish]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.translations-check.result }}" != "success" ] || \
             [ "${{ needs.docker-verify.result }}" != "success" ]; then
            echo "One or more required CI verification jobs failed!"
            exit 1
          fi

          if [ "${{ github.event_name }}" == "push" ] && \
             ( [ "${{ github.ref }}" == "refs/heads/main" ] || [[ "${{ github.ref }}" == refs/tags/* ]] ); then
            if [ "${{ needs.docker-publish.result }}" != "success" ]; then
              echo "Docker publish job failed!"
              exit 1
            fi
          fi

          echo "All CI checks passed!"

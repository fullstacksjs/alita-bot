name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Security scanning
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Gosec Security Scanner
        uses: securego/gosec@v2.28.0
        with:
          args: -no-fail -fmt sarif -out gosec.sarif ./...

      - name: Upload Gosec SARIF
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec.sarif
          category: gosec

      - name: Run govulncheck
        continue-on-error: true
        uses: golang/govulncheck-action@v1

  # Code quality & formatting
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check code formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted with gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Run linting
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          install-mode: binary
          args: --timeout 10m
          only-new-issues: true

      - name: Technical Debt Tracking
        run: |
          echo "## 📋 Technical Debt Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          TODO_COUNT=$(grep -r -n "TODO" --include="*.go" . 2>/dev/null | grep -v "godot\|godoc" | wc -l)
          FIXME_COUNT=$(grep -r -n "FIXME" --include="*.go" . 2>/dev/null | wc -l)
          HACK_COUNT=$(grep -r -n "HACK" --include="*.go" . 2>/dev/null | wc -l)
          XXX_COUNT=$(grep -r -n "XXX" --include="*.go" . 2>/dev/null | wc -l)

          echo "| Marker | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| TODO | $TODO_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| FIXME | $FIXME_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| HACK | $HACK_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| XXX | $XXX_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          TOTAL=$((TODO_COUNT + FIXME_COUNT + HACK_COUNT + XXX_COUNT))
          echo "**Total Technical Debt Markers: $TOTAL**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$TOTAL" -gt 0 ]; then
            echo "### Details" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -r -n -E "(TODO|FIXME|HACK|XXX)" --include="*.go" . 2>/dev/null | head -50 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Please ensure TODO/FIXME comments reference an issue (e.g., TODO(#123))" >> $GITHUB_STEP_SUMMARY

      - name: Run duplicate code detection
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          install-mode: binary
          args: --default=none --enable dupl --timeout 10m
          only-new-issues: true

      - name: Cyclomatic Complexity Analysis
        run: |
          echo "## 📊 Cyclomatic Complexity Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest

          echo "### Functions with Complexity > 15" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          HIGH_COMPLEX=$(gocyclo -over 15 . 2>/dev/null | grep -v "could not get file info" | sort -t= -k2 -nr || true)

          if [ -n "$HIGH_COMPLEX" ]; then
            echo "| Complexity | Function | Location |" >> $GITHUB_STEP_SUMMARY
            echo "|------------|----------|----------|" >> $GITHUB_STEP_SUMMARY
            echo "$HIGH_COMPLEX" | while read line; do
              COMPLEX=$(echo "$line" | awk '{print $1}')
              PKG=$(echo "$line" | awk '{print $2}')
              FUNC=$(echo "$line" | awk '{print $3}')
              LOC=$(echo "$line" | awk '{print $4}')
              echo "| $COMPLEX | $PKG.$FUNC | $LOC |" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Warning:** Functions with high cyclomatic complexity should be refactored for better maintainability." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No functions with cyclomatic complexity > 15 detected." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Complexity Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "**Top 10 Most Complex Functions:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          gocyclo . 2>/dev/null | grep -v "could not get file info" | sort -t= -k2 -nr | head -10 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # Build verification
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Extract short commit SHA
        id: short-sha
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Build Go binary
        run: |
          set -euo pipefail
          short_sha="${{ steps.short-sha.outputs.short_sha }}"
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X github.com/divkix/Alita_Robot/alita/config.Commit=${short_sha}" -o /tmp/alita_robot .
          if [ "$(cd /tmp && ./alita_robot --version)" != "$short_sha" ]; then
            echo "::error::--version did not report the injected commit ${short_sha}"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact-${{ github.sha }}
          path: /tmp/alita_robot
          retention-days: 7

  # Automated regression tests
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT_TOKEN: test-token
      OWNER_ID: "1"
      SQLITE_PATH: "/tmp/alita-ci.db"
      USE_WEBHOOKS: "false"
      LOG_LEVEL: "info"
      CGO_ENABLED: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Ensure C toolchain for CGO
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential libsqlite3-dev

      - name: Run test suite
        run: |
          start_time=$(date +%s)
          make test || test_exit=$?
          end_time=$(date +%s)
          duration=$((end_time - start_time))

          echo "Test suite duration: ${duration}s"

          echo "## 🧪 Test Suite Performance" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total Duration:** ${duration} seconds" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -n "${test_exit}" ]; then
            exit ${test_exit}
          fi

      - name: Report coverage
        if: always()
        run: |
          if [ -f coverage.out ]; then
            COVERAGE=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}')
            echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Total Coverage:** ${COVERAGE}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage.out
          retention-days: 30
          if-no-files-found: ignore

  # Translation completeness gate
  translations-check:
    name: Translations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check translations
        run: make check-translations

  # Production image build plus runtime check
  docker-verify:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Extract short commit SHA
        id: short-sha
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Build production image (linux/amd64)
        run: |
          set -euo pipefail
          docker build --build-arg COMMIT=${{ steps.short-sha.outputs.short_sha }} -f docker/alpine -t test-build:latest .

      - name: Verify container health and SQLite persistence
        run: scripts/docker-acceptance/run.sh test-build:latest

  # CI success gate
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [security, lint, build, test, translations-check, docker-verify]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.translations-check.result }}" != "success" ] || \
             [ "${{ needs.docker-verify.result }}" != "success" ]; then
            echo "One or more CI jobs failed!"
            exit 1
          fi

          echo "All CI checks passed!"

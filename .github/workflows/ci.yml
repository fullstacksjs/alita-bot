name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Verify code formatting and linting
  lint:
    name: Code Quality & Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check code formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted with gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Run linting
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          install-mode: binary
          args: --timeout 10m

  # Binary compilation verification
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Extract short commit SHA
        id: short-sha
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Build Go binary
        run: |
          set -euo pipefail
          short_sha="${{ steps.short-sha.outputs.short_sha }}"
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X github.com/divkix/Alita_Robot/alita/config.Commit=${short_sha}" -o /tmp/alita_robot .
          if [ "$(cd /tmp && ./alita_robot --version)" != "$short_sha" ]; then
            echo "::error::--version did not report the injected commit ${short_sha}"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact-${{ github.sha }}
          path: /tmp/alita_robot
          retention-days: 7

  # Automated unit and integration tests (including race detector)
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT_TOKEN: test-token
      OWNER_ID: "1"
      SQLITE_PATH: "/tmp/alita-ci.db"
      USE_WEBHOOKS: "false"
      LOG_LEVEL: "info"
      CGO_ENABLED: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Ensure C toolchain for CGO
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential libsqlite3-dev

      - name: Run test suite
        run: make test

      - name: Report coverage
        if: always()
        run: |
          if [ -f coverage.out ]; then
            COVERAGE=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}')
            echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Total Coverage:** ${COVERAGE}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage.out
          retention-days: 30
          if-no-files-found: ignore

  # Translation completeness gate
  translations-check:
    name: Translations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check translations
        run: make check-translations

  # Production image build plus a runtime check of the supported deployment
  docker-verify:
    name: Docker Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract short commit SHA
        id: short-sha
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Build production image (linux/amd64)
        run: |
          set -euo pipefail
          docker build --build-arg COMMIT=${{ steps.short-sha.outputs.short_sha }} -f docker/alpine -t test-build:latest .

      - name: Verify container health and SQLite persistence
        run: scripts/docker-acceptance/run.sh test-build:latest

  # CI success gate
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, build, test, translations-check, docker-verify]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.translations-check.result }}" != "success" ] || \
             [ "${{ needs.docker-verify.result }}" != "success" ]; then
            echo "One or more required CI verification jobs failed!"
            exit 1
          fi

          echo "All CI checks passed!"

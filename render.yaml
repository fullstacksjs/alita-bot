services:
  # Main bot service
  - type: web
    name: alita-robot
    runtime: docker
    dockerfilePath: ./docker/alpine
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    disk:
      name: alita-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: MESSAGE_DUMP
        sync: false
      - key: SQLITE_PATH
        value: "/data/alita.db"
      - key: HTTP_PORT
        value: "10000"

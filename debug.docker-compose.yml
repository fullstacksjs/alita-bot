# This is to run the alita-robot in debug mode with alpine image
# This starts up fast and does not do any optimizations
services:
  alita:
    build:
      context: .
      dockerfile: docker/alpine.debug
    container_name: alita-robot
    restart: always
    env_file:
      - .env
    environment:
      SQLITE_PATH: ${SQLITE_PATH:-/data/alita.db}
    volumes:
      - alita_debug_data:/data

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    # no ports published; internal use

volumes:
  alita_debug_data:
  telegram-bot-api-data:
